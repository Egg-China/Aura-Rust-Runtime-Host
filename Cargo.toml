[workspace]
members = [
    "crates/hmcl-runtime-abi",
    "crates/hmcl-runtime-protocol",
    "crates/hmcl-plugin-sdk",
    "crates/hmcl-rust-host-process",
    "crates/hmcl-rust-host-native",
]
exclude = ["crates/hmcl-rust-host-native/tests/fixtures"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "GPL-3.0-or-later"
rust-version = "1.97.1"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
missing_safety_doc = "deny"
